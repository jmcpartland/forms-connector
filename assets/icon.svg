<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B3FD9"/>
      <stop offset="1" stop-color="#0F9EA8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1030" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- form card -->
  <g filter="url(#shadow)">
    <rect x="116" y="78" width="280" height="356" rx="32" fill="#FFFFFF"/>
  </g>
  <rect x="152" y="116" width="150" height="22" rx="11" fill="#3B3FD9"/>
  <!-- row 1: checked -->
  <rect x="152" y="176" width="46" height="46" rx="12" fill="#0F9EA8"/>
  <path d="M164 199 l11 11 l19 -22" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="188" width="140" height="22" rx="11" fill="#C9CEE8"/>
  <!-- row 2: checked -->
  <rect x="152" y="252" width="46" height="46" rx="12" fill="#0F9EA8"/>
  <path d="M164 275 l11 11 l19 -22" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="264" width="112" height="22" rx="11" fill="#C9CEE8"/>
  <!-- row 3: empty -->
  <rect x="155" y="331" width="40" height="40" rx="10" fill="none" stroke="#AEB4D6" stroke-width="6"/>
  <rect x="216" y="340" width="124" height="22" rx="11" fill="#C9CEE8"/>
  <!-- connector badge -->
  <g filter="url(#shadow)">
    <circle cx="368" cy="372" r="72" fill="#FFFFFF"/>
  </g>
  <circle cx="368" cy="372" r="58" fill="#3B3FD9"/>
  <circle cx="344" cy="372" r="13" fill="none" stroke="#fff" stroke-width="8"/>
  <circle cx="392" cy="372" r="13" fill="none" stroke="#fff" stroke-width="8"/>
  <path d="M357 372 h22" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
</svg>
